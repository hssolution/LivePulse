<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>세션 만들기 · LivePulse 시안</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="stylesheet" href="../assets/mockup.css" />
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 text-slate-800">

<!-- 상단 바 -->
<header class="bg-white border-b border-slate-200 px-6 py-3.5 flex items-center justify-between sticky top-0 z-30">
  <a href="01-session-list.html" class="flex items-center gap-2 text-sm font-semibold text-slate-600 hover:text-slate-900">
    <i data-lucide="arrow-left" class="w-4 h-4"></i> 세션 목록
  </a>
  <div class="font-bold">새 세션 만들기</div>
  <div class="w-24"></div>
</header>

<main class="max-w-3xl mx-auto px-6 py-8">

  <!-- 스텝 인디케이터 -->
  <div class="flex items-center gap-3 mb-8">
    <button onclick="showStep(1)" id="tab1" class="flex items-center gap-2 text-sm font-semibold">
      <span class="step-num w-7 h-7 rounded-full flex items-center justify-center bg-indigo-600 text-white">1</span>
      기본 정보
    </button>
    <div class="flex-1 h-0.5 bg-slate-200"></div>
    <button onclick="showStep(2)" id="tab2" class="flex items-center gap-2 text-sm font-semibold">
      <span class="step-num w-7 h-7 rounded-full flex items-center justify-center bg-slate-200 text-slate-500">2</span>
      화면 템플릿 선택
    </button>
  </div>

  <!-- STEP 1: 기본 정보 -->
  <section id="step1" class="bg-white rounded-2xl border border-slate-200 p-7">
    <h2 class="text-lg font-bold mb-1">세션 기본 정보</h2>
    <p class="text-sm text-slate-500 mb-6">강연 정보를 입력하세요. 입력한 내용은 청중 참가 화면에 표시됩니다.</p>

    <div class="space-y-5">
      <div>
        <label class="block text-sm font-semibold mb-1.5">세션명 <span class="text-rose-500">*</span></label>
        <input type="text" value="2026 HR 리더십 컨퍼런스" class="w-full px-3.5 py-2.5 text-sm rounded-lg border border-slate-200 focus:outline-none focus:border-indigo-400" />
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold mb-1.5">시작 일시 <span class="text-rose-500">*</span></label>
          <input type="text" value="2026-05-22  14:00" class="w-full px-3.5 py-2.5 text-sm rounded-lg border border-slate-200" />
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1.5">종료 일시 <span class="text-rose-500">*</span></label>
          <input type="text" value="2026-05-22  17:00" class="w-full px-3.5 py-2.5 text-sm rounded-lg border border-slate-200" />
        </div>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold mb-1.5">장소명 <span class="text-rose-500">*</span></label>
          <input type="text" value="코엑스 그랜드볼룸" class="w-full px-3.5 py-2.5 text-sm rounded-lg border border-slate-200" />
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1.5">최대 참가 인원 <span class="text-rose-500">*</span></label>
          <input type="text" value="250" class="w-full px-3.5 py-2.5 text-sm rounded-lg border border-slate-200" />
        </div>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold mb-1.5">담당자 연락처 <span class="text-rose-500">*</span></label>
          <input type="text" value="02-1234-5678" class="w-full px-3.5 py-2.5 text-sm rounded-lg border border-slate-200" />
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1.5">담당자 이메일 <span class="text-rose-500">*</span></label>
          <input type="text" value="event@hssol.kr" class="w-full px-3.5 py-2.5 text-sm rounded-lg border border-slate-200" />
        </div>
      </div>
      <div>
        <label class="block text-sm font-semibold mb-1.5">설명 <span class="text-slate-400 font-normal">(선택)</span></label>
        <textarea rows="2" class="w-full px-3.5 py-2.5 text-sm rounded-lg border border-slate-200">HR 리더 200여 명이 모여 조직문화와 리더십을 논의하는 연례 컨퍼런스입니다.</textarea>
      </div>
    </div>

    <div class="flex justify-end mt-7">
      <button onclick="showStep(2)" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-5 py-2.5 rounded-lg flex items-center gap-2">
        다음: 템플릿 선택 <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </div>
  </section>

  <!-- STEP 2: 템플릿 선택 -->
  <section id="step2" class="hidden">
    <div class="bg-white rounded-2xl border border-slate-200 p-7">
      <h2 class="text-lg font-bold mb-1">화면 템플릿 선택</h2>
      <p class="text-sm text-slate-500 mb-6">
        청중이 보는 3개 화면의 디자인을 각각 고릅니다. 썸네일로 미리 확인하고 선택하세요.
        선택 후 설정 에디터에서 로고·배너를 교체할 수 있습니다.
      </p>

      <!-- 참가 템플릿 -->
      <div class="mb-7">
        <div class="flex items-center gap-2 mb-3">
          <i data-lucide="qr-code" class="w-4 h-4 text-indigo-600"></i>
          <h3 class="font-bold text-sm">참가 화면 템플릿 <span class="text-slate-400 font-normal">— /join · 대기 로비에 적용</span></h3>
        </div>
        <div class="grid grid-cols-3 gap-3">
          <label class="cursor-pointer">
            <div class="rounded-xl border-2 border-indigo-500 overflow-hidden ring-2 ring-indigo-200">
              <div class="h-28 bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center">
                <div class="w-20 h-14 bg-white/90 rounded shadow-lg flex flex-col items-center justify-center gap-1">
                  <div class="w-12 h-1.5 bg-indigo-300 rounded"></div>
                  <div class="w-8 h-1.5 bg-slate-200 rounded"></div>
                </div>
              </div>
              <div class="p-2.5 bg-white flex items-center justify-between">
                <span class="text-sm font-bold">심포지엄</span>
                <i data-lucide="check-circle-2" class="w-4 h-4 text-indigo-600"></i>
              </div>
            </div>
          </label>
          <label class="cursor-pointer">
            <div class="rounded-xl border border-slate-200 overflow-hidden hover:border-slate-300">
              <div class="h-28 bg-slate-900 flex items-center justify-center">
                <div class="w-24 h-16 bg-white/10 rounded border border-white/20 flex items-center justify-center">
                  <div class="w-14 h-2 bg-white/40 rounded"></div>
                </div>
              </div>
              <div class="p-2.5 bg-white"><span class="text-sm font-bold">컨퍼런스</span></div>
            </div>
          </label>
          <label class="cursor-pointer">
            <div class="rounded-xl border border-slate-200 overflow-hidden hover:border-slate-300">
              <div class="h-28 bg-gradient-to-br from-slate-50 to-slate-200 flex items-center justify-center">
                <div class="w-20 h-16 bg-white rounded shadow flex flex-col items-center justify-center gap-1">
                  <div class="w-10 h-1.5 bg-slate-300 rounded"></div>
                </div>
              </div>
              <div class="p-2.5 bg-white"><span class="text-sm font-bold">워크숍</span></div>
            </div>
          </label>
        </div>
      </div>

      <!-- Q&A 템플릿 -->
      <div class="mb-7">
        <div class="flex items-center gap-2 mb-3">
          <i data-lucide="message-circle" class="w-4 h-4 text-indigo-600"></i>
          <h3 class="font-bold text-sm">Q&A 화면 템플릿 <span class="text-slate-400 font-normal">— /live Q&A · 송출에 적용</span></h3>
        </div>
        <div class="grid grid-cols-3 gap-3">
          <label class="cursor-pointer">
            <div class="rounded-xl border-2 border-indigo-500 overflow-hidden ring-2 ring-indigo-200">
              <div class="h-24 bg-white border-b flex flex-col gap-1.5 p-3 justify-center">
                <div class="h-3 bg-indigo-100 rounded w-full"></div>
                <div class="h-3 bg-slate-100 rounded w-4/5"></div>
              </div>
              <div class="p-2.5 bg-white flex items-center justify-between">
                <span class="text-sm font-bold">기본형</span>
                <i data-lucide="check-circle-2" class="w-4 h-4 text-indigo-600"></i>
              </div>
            </div>
          </label>
          <label class="cursor-pointer">
            <div class="rounded-xl border border-slate-200 overflow-hidden hover:border-slate-300">
              <div class="h-24 bg-slate-50 flex flex-col gap-1.5 p-3 justify-center">
                <div class="h-3 bg-slate-200 rounded w-full"></div>
                <div class="h-3 bg-slate-200 rounded w-3/5"></div>
              </div>
              <div class="p-2.5 bg-white"><span class="text-sm font-bold">미니멀</span></div>
            </div>
          </label>
          <label class="cursor-pointer">
            <div class="rounded-xl border border-dashed border-slate-300 overflow-hidden hover:border-slate-400 flex items-center justify-center h-[124px] bg-slate-50">
              <span class="text-xs text-slate-400 font-medium">참가 템플릿 따름</span>
            </div>
          </label>
        </div>
      </div>

      <!-- 투표 템플릿 -->
      <div class="mb-2">
        <div class="flex items-center gap-2 mb-3">
          <i data-lucide="bar-chart-3" class="w-4 h-4 text-indigo-600"></i>
          <h3 class="font-bold text-sm">투표 화면 템플릿 <span class="text-slate-400 font-normal">— /live 투표 · 결과 송출에 적용</span></h3>
        </div>
        <div class="grid grid-cols-3 gap-3">
          <label class="cursor-pointer">
            <div class="rounded-xl border-2 border-indigo-500 overflow-hidden ring-2 ring-indigo-200">
              <div class="h-24 bg-white flex flex-col gap-1.5 p-3 justify-center">
                <div class="h-3 bg-indigo-500 rounded" style="width:80%"></div>
                <div class="h-3 bg-indigo-300 rounded" style="width:55%"></div>
                <div class="h-3 bg-indigo-200 rounded" style="width:35%"></div>
              </div>
              <div class="p-2.5 bg-white flex items-center justify-between">
                <span class="text-sm font-bold">막대 차트</span>
                <i data-lucide="check-circle-2" class="w-4 h-4 text-indigo-600"></i>
              </div>
            </div>
          </label>
          <label class="cursor-pointer">
            <div class="rounded-xl border border-slate-200 overflow-hidden hover:border-slate-300">
              <div class="h-24 bg-white flex items-center justify-center">
                <div class="w-12 h-12 rounded-full border-[7px] border-indigo-500 border-r-indigo-200 border-b-indigo-200"></div>
              </div>
              <div class="p-2.5 bg-white"><span class="text-sm font-bold">도넛 차트</span></div>
            </div>
          </label>
          <label class="cursor-pointer">
            <div class="rounded-xl border border-dashed border-slate-300 overflow-hidden hover:border-slate-400 flex items-center justify-center h-[124px] bg-slate-50">
              <span class="text-xs text-slate-400 font-medium">참가 템플릿 따름</span>
            </div>
          </label>
        </div>
      </div>
    </div>

    <div class="flex justify-between mt-6">
      <button onclick="showStep(1)" class="bg-white border border-slate-200 hover:border-slate-300 text-slate-600 text-sm font-semibold px-5 py-2.5 rounded-lg flex items-center gap-2">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> 이전
      </button>
      <a href="03-setup-editor.html" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold px-6 py-2.5 rounded-lg flex items-center gap-2">
        <i data-lucide="check" class="w-4 h-4"></i> 세션 만들고 설정하기
      </a>
    </div>
  </section>

</main>

<script src="../assets/mockup.js"></script>
<script>
  function showStep(n) {
    document.getElementById('step1').classList.toggle('hidden', n !== 1);
    document.getElementById('step2').classList.toggle('hidden', n !== 2);
    [1, 2].forEach(function (i) {
      var num = document.querySelector('#tab' + i + ' .step-num');
      var on = i <= n;
      num.className = 'step-num w-7 h-7 rounded-full flex items-center justify-center ' +
        (on ? 'bg-indigo-600 text-white' : 'bg-slate-200 text-slate-500');
    });
    window.scrollTo(0, 0);
  }
</script>
</body>
</html>
