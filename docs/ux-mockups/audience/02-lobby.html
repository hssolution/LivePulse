<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>청중 · 대기 로비 · LivePulse 시안</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="stylesheet" href="../assets/mockup.css" />
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<div class="phone-stage">
  <div class="phone-caption">
    <b>STEP 2 · 대기 로비</b> &nbsp;—&nbsp; 입장 완료 후 발표자가 시작하기 전까지의 화면 (현재 없는 화면)
  </div>

  <div class="phone-frame">
    <div class="phone-notch"></div>
    <div class="phone-screen no-scrollbar">

      <div class="min-h-full bg-gradient-to-b from-slate-50 to-indigo-50 flex flex-col">

        <!-- 헤더 -->
        <div class="px-5 pt-12 pb-4 flex items-center justify-between">
          <div class="flex items-center gap-2 text-xs font-semibold text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-full">
            <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> 입장 완료
          </div>
          <div class="text-xs text-slate-400">참여코드 HR2026</div>
        </div>

        <!-- 중앙 대기 영역 -->
        <div class="flex-1 flex flex-col items-center justify-center px-6 text-center">
          <div class="relative mb-6">
            <div class="w-24 h-24 rounded-full bg-indigo-100 flex items-center justify-center">
              <i data-lucide="hourglass" class="w-10 h-10 text-indigo-600"></i>
            </div>
            <span class="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-indigo-600 flex items-center justify-center">
              <span class="live-dot" style="background:#fff"></span>
            </span>
          </div>

          <h1 class="text-xl font-bold text-slate-800">곧 시작합니다</h1>
          <p class="text-sm text-slate-500 mt-2 leading-relaxed">
            발표자가 강연을 시작하면<br/>이 화면이 자동으로 전환됩니다
          </p>

          <div class="mt-5 bg-white rounded-2xl shadow-sm border border-slate-100 p-4 w-full">
            <div class="text-xs font-semibold text-indigo-500 mb-1">참여 중인 강연</div>
            <div class="font-bold text-slate-800">2026 HR 리더십 컨퍼런스</div>
            <div class="text-xs text-slate-500 mt-1 flex items-center justify-center gap-1">
              <i data-lucide="clock" class="w-3.5 h-3.5"></i> 14:00 시작 예정
            </div>
          </div>
        </div>

        <!-- 발표자 소개 -->
        <div class="px-5 pb-5">
          <h2 class="text-xs font-bold text-slate-400 mb-2">오늘의 발표자</h2>
          <div class="bg-white rounded-2xl border border-slate-100 divide-y divide-slate-100">
            <div class="flex items-center gap-3 p-3.5">
              <div class="w-11 h-11 rounded-full bg-indigo-500 text-white flex items-center justify-center font-bold">김</div>
              <div>
                <div class="font-semibold text-sm">김도현</div>
                <div class="text-xs text-slate-500">조직문화 컨설턴트</div>
              </div>
            </div>
            <div class="flex items-center gap-3 p-3.5">
              <div class="w-11 h-11 rounded-full bg-rose-500 text-white flex items-center justify-center font-bold">박</div>
              <div>
                <div class="font-semibold text-sm">박서연</div>
                <div class="text-xs text-slate-500">HR 테크 대표</div>
              </div>
            </div>
          </div>
        </div>

        <!-- 데모: 시작 시 자동 전환 -->
        <div class="px-5 pb-8">
          <a href="03-live.html" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2">
            <span class="live-dot" style="background:#fff"></span> 강연 시작됨 — 라이브 입장
          </a>
          <p class="text-center text-[11px] text-slate-400 mt-2">실제로는 발표자 시작 시 자동 전환 (데모용 버튼)</p>
        </div>

      </div>

    </div>
  </div>

  <div class="phone-caption">"대기 → 라이브" 상태 흐름의 빈칸을 채우는 신규 화면</div>
</div>

<script src="../assets/mockup.js"></script>
</body>
</html>
